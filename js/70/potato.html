<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr Potato Head</title>
    <style>
      body {
        background-color: beige;
        display: grid;
        grid-template-columns: 3fr 1fr;
        margin: 0;
        padding: 0;
        
      }
      header {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100px;
        gap: 8em;
        border-bottom: 5px dotted black;
      }
      .title {
        align-self: center;
      }
      .newBtn {
        align-self: center;
        height: 50%;
        display: flex;
        justify-content: center;
        align-items: center;

        padding: 12px 24px;
        background: linear-gradient(135deg, #4caf50, #2e7d32);
        color: white;
        font-size: 1.2rem;
        font-weight: 600;

        border: none;
        border-radius: 10px;
        cursor: pointer;

        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .newBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      }

      .newBtn:active {
        transform: translateY(0);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      }
      .head {
        margin: 10px;
      }
      .side {
        height: 700px;
        background-color: white;
        margin: 0;
        padding: 3px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
      /* overflow: scroll; */
      }
      .center{
        background-color: antiquewhite;
        height: 70;
      }
    </style>
  </head>

  <body>
    <header>
      <img class="head" src="./0.png" />
      <h2 class="title">Create A Mr Potato Head!</h2>
      <button class="newBtn">New Game</button>
       <audio id="bgMusic" src="3A 135 Zusha - Aleph Beis.MP3" loop controls></audio>
    </header>
     
    <div class="side">
      <div class="parts"><img src="./1.png" /></div>
      <div class="parts"><img src="./2.png" /></div>
      <div class="parts"><img src="./3.png" /></div>
      <div class="parts"><img src="./4.png" /></div>
      <div class="parts"><img src="./5.png" /></div>
      <div class="parts"><img src="./6.png" /></div>
      <div class="parts"><img src="./7.png" /></div>
      <div class="parts"><img src="./8.png" /></div>
      <div class="parts"><img src="./9.png" /></div>
      <div class="parts"><img src="./10.png" /></div>
      <div class="parts"><img src="./11.png" /></div>
      <div class="parts"><img src="./12.png" /></div>
      <div class="parts"><img src="./13.png" /></div>
      <div class="parts"><img src="./14.png" /></div>
    </div>
   

    <script src="potato.js" type="module"></script>
  </body>
</html>
