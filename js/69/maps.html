<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        width: 100%;
        margin: 0;
      }

      body {
        display: grid;
        grid-template-columns: 1fr 3fr;
      }

      #sidebar {
        border-right: 1px solid black;
        height: 100%;
        overflow: auto;
        overflow-x: hidden;
        box-sizing: border-box;
      }

      #searchForm {
        display: flex;
        /*padding: 1em;*/
      }

      #search {
        flex: 1;
      }

      .marker-image,
      #sidebar img {
        width: 32px;
      }

      #places {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      #places li {
        margin-top: 1em;
        border: 1px solid black;
        border-radius: 8px;
      }

      .info {
        display: flex;
        gap: 1em;
        padding-right: 2em;
      }

      #places li span {
        flex: 1;
        margin: auto;
        padding-left: 2em;
      }

      .summary {
        /*display: none;*/
        height: 0;
        transition: 2s;
        overflow: hidden;
      }

      .active {
        height: 6em;
      }


    </style>
  </head>
  <body>
    <div id="sidebar">
      <form id="searchForm">
        <input id="search" type="text" required />
        <button>go</button>
      </form><button class ="clrBtn">clear</button>
      <hr />
      <ul id="places"></ul>
    </div>
    <div id="map"></div>

    <script src="maps.js" type="module"></script>
  </body>
</html>
